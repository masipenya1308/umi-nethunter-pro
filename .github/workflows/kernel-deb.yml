name: umi kernel package (NetHunter Pro)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: umi-nethunter-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_REF: v6.12
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  kernel:
    name: linux-image deb + DTB
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: The kernel itself
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/umi-mainline.git ../umi-mainline
          git -C ../umi-mainline rev-parse HEAD

      - name: Toolchain and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            dpkg-dev fakeroot kmod cpio xz-utils zstd rsync \
            device-tree-compiler python3 \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          aarch64-linux-gnu-gcc --version | head -1

      - name: Build
        run: |
          sh kernel/build-kernel-deb.sh
          dpkg-deb -I kernel/out/linux-image-*.deb | sed -n '1,12p'

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: umi-kernel-deb
          path: |
            kernel/out/*.deb
            kernel/out/config-effective
            build/out/sm8250-xiaomi-umi-wifi.dtb
            build/out/Image.gz
          if-no-files-found: error
          retention-days: 30
